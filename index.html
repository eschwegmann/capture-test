<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capture Test</title>
<style>
  body { margin:0; font-family:system-ui,sans-serif; background:#111; color:#eee; }
  #stage { text-align:center; background:#000; }
  #wrap { position:relative; display:inline-block; line-height:0; }
  video { max-width:100%; max-height:60vh; display:block; }
  #guide { position:absolute; left:8%; top:25%; width:84%; height:50%;
           border:3px solid #fff; border-radius:10px; box-sizing:border-box; }
  #guide.hit { border-color:#3ddc84; }
  #bar { display:flex; gap:8px; padding:10px; }
  button { flex:1; font-size:17px; padding:14px 6px; border:0; border-radius:8px;
           background:#2d6cdf; color:#fff; }
  button.alt { background:#444; }
  #info, #result { padding:0 12px; font-size:15px; line-height:1.6; }
  #result b { color:#3ddc84; }
  .warn { color:#ffb340; }
  .raw { font-family:monospace; word-break:break-all; color:#bbb; }
  #photo { width:100%; margin-top:10px; display:none; }
  #extract { padding:6px 12px 0; font-size:15px; line-height:1.6; border-top:1px solid #333; margin-top:8px; }
  #extract b { color:#7cc4ff; }
  .bad { color:#ff6b6b; font-weight:600; }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <video id="video" playsinline muted></video><div id="guide"></div>
</div></div>
<div id="bar">
  <button id="btnStart">Start camera</button>
  <button id="btnShot" class="alt">Photo only</button>
  <button id="btnLight" class="alt">Light</button>
</div>
<div id="info">Version 5. Tap Start camera, then aim at the case label.</div>
<div id="result"></div>
<div id="extract"></div>
<img id="photo" alt="Captured label">

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const VERSION = 5;
const EXTRACT_URL = 'https://script.google.com/macros/s/AKfycbzXu4w5-gX9DVAITBlr7pb2A4m7SajbiZhj3cRAu3zxh8rVHV9gqAW3DS58DU0vVD8x8w/exec';   // the label reader's Web app URL from Apps Script
const GS = '\u001d';            // separator character inside GS1 barcodes
const WAIT_FOR_GS1_MS = 1500;   // keep looking this long for a GS1 code before accepting a UPC or other code

const $ = id => document.getElementById(id);
const video = $('video');
const frame = document.createElement('canvas');
let track = null, nativeScanner = null, zxingReader = null;
let scanning = false, lightOn = false, startedAt = 0;
let fallback = null;            // best non-GS1 code seen so far: { text, at }

// ---------- camera ----------
async function startCamera() {
  try {
    $('info').textContent = 'Starting camera...';
    let stream = await openCamera({ facingMode: { ideal: 'environment' } });
    if (!hasTorch(stream.getVideoTracks()[0])) stream = await findTorchCamera(stream);
    video.srcObject = stream;
    await video.play();
    track = stream.getVideoTracks()[0];
  } catch (e) {
    $('info').textContent = 'Camera error: ' + e.message;
    return;
  }
  await setUpScanner();
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  $('info').textContent = 'v' + VERSION + ' | Camera ' + video.videoWidth + ' x ' + video.videoHeight +
    ' | scanner: ' + (nativeScanner ? 'built-in' : zxingReader ? 'ZXing' : 'none') +
    ' | light: ' + (caps.torch ? 'yes' : 'no');
  $('btnStart').textContent = 'Scan again';
  resume();
}

const SIZE = { width: { ideal: 1920 }, height: { ideal: 1080 } };

function openCamera(constraints) {
  return navigator.mediaDevices.getUserMedia({ audio: false, video: Object.assign({}, SIZE, constraints) });
}

function hasTorch(t) {
  return !!(t && t.getCapabilities && t.getCapabilities().torch);
}

// Phones with several back lenses often hand the browser one without the flash.
// Try the other back cameras and keep the first one that can turn the light on.
async function findTorchCamera(stream) {
  const first = stream.getVideoTracks()[0];
  const firstId = first.getSettings().deviceId;
  const cams = (await navigator.mediaDevices.enumerateDevices())
    .filter(d => d.kind === 'videoinput' && d.deviceId !== firstId && !/front|user/i.test(d.label));
  if (!cams.length) return stream;
  first.stop();
  for (const cam of cams) {
    try {
      const s = await openCamera({ deviceId: { exact: cam.deviceId } });
      if (hasTorch(s.getVideoTracks()[0])) return s;
      s.getTracks().forEach(t => t.stop());
    } catch (e) { /* that camera would not open */ }
  }
  return openCamera({ deviceId: { exact: firstId } });   // none had a light; go back to the first one
}

async function setUpScanner() {
  const wanted = ['code_128', 'itf', 'ean_13', 'upc_a', 'data_matrix', 'qr_code'];
  if ('BarcodeDetector' in window) {
    try {
      const supported = await BarcodeDetector.getSupportedFormats();
      const formats = wanted.filter(f => supported.indexOf(f) !== -1);
      if (formats.length) nativeScanner = new BarcodeDetector({ formats: formats });
    } catch (e) { nativeScanner = null; }
  }
  if (!nativeScanner && window.ZXing) {
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.DATA_MATRIX, ZXing.BarcodeFormat.QR_CODE]);
    hints.set(ZXing.DecodeHintType.ASSUME_GS1, true);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    zxingReader = new ZXing.MultiFormatReader();
    zxingReader.setHints(hints);
  }
}

function resume() {
  if (!track) return;
  scanning = true;
  fallback = null;
  startedAt = Date.now();
  $('guide').classList.remove('hit');
  $('result').innerHTML = '';
  $('extract').innerHTML = '';
  $('photo').style.display = 'none';
  tick();
}

// ---------- scan loop ----------
// Reads the whole frame, so labels turned sideways still scan.
// A GS1 code wins right away. A UPC or other code is only accepted
// if no GS1 code turns up within WAIT_FOR_GS1_MS.
async function tick() {
  if (!scanning) return;
  const texts = [];
  const vw = video.videoWidth, vh = video.videoHeight;
  if (vw) {
    frame.width = vw; frame.height = vh;
    frame.getContext('2d', { willReadFrequently: true }).drawImage(video, 0, 0, vw, vh);
    try {
      if (nativeScanner) {
        (await nativeScanner.detect(frame)).forEach(b => texts.push(b.rawValue));
      } else if (zxingReader) {
        const source = new ZXing.HTMLCanvasElementLuminanceSource(frame);
        const bitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(source));
        texts.push(zxingReader.decode(bitmap).getText());
      }
    } catch (e) { /* nothing found in this frame */ }
  }
  if (!scanning) return;

  const best = pickBest(texts);
  if (best && best.gs1) return onDecode(best.text, '');
  if (best && (!fallback || best.score > fallback.score)) fallback = { text: best.text, score: best.score, at: Date.now() };
  if (fallback && Date.now() - fallback.at > WAIT_FOR_GS1_MS) {
    return onDecode(fallback.text, 'No GS1 barcode found, so this is the only code it could read.');
  }
  setTimeout(tick, 120);
}

// Score each code found: GS1 with a lot beats GS1 without one, which beats anything else.
function pickBest(texts) {
  let best = null;
  texts.forEach(t => {
    const f = parseGs1(t);
    let score = plainGtin(t) ? 50 : 0;
    if (f) {
      score = 100 + f.length;
      if (f.some(x => x.ai === '10')) score += 20;
      if (f.some(x => x.ai === '01')) score += 10;
    }
    if (!best || score > best.score) best = { text: t, gs1: !!f, score: score };
  });
  return best;
}

function onDecode(text, warning) {
  scanning = false;
  const seconds = ((Date.now() - startedAt) / 1000).toFixed(1);
  $('guide').classList.add('hit');
  if (navigator.vibrate) navigator.vibrate(80);
  const shot = takePhoto();
  showResult(text, seconds, warning);
  readLabel(shot, barcodeSummary(text));
}

function takePhoto() {
  if (!video.videoWidth) return null;
  const full = document.createElement('canvas');
  full.width = video.videoWidth; full.height = video.videoHeight;
  full.getContext('2d').drawImage(video, 0, 0);
  $('photo').src = full.toDataURL('image/jpeg', 0.9);
  $('photo').style.display = 'block';
  return full;
}

// ---------- label reading (photo -> Apps Script -> Gemini) ----------
function barcodeSummary(text) {
  const f = parseGs1(text);
  if (f) {
    const get = ai => (f.find(x => x.ai === ai) || {}).val || null;
    return { gtin: get('01'), lot: get('10') };
  }
  return { gtin: plainGtin(text), lot: null };
}

function accessCode(reset) {
  let code = null;
  try { if (reset) localStorage.removeItem('labelReaderCode'); code = localStorage.getItem('labelReaderCode'); } catch (e) {}
  if (!code) {
    code = window.prompt('Enter the label reader access code');
    if (code) { try { localStorage.setItem('labelReaderCode', code); } catch (e) {} }
  }
  return code;
}

function smallJpeg(canvas) {
  const scale = Math.min(1, 1600 / Math.max(canvas.width, canvas.height));
  const c = document.createElement('canvas');
  c.width = Math.round(canvas.width * scale); c.height = Math.round(canvas.height * scale);
  c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85).split(',')[1];
}

async function readLabel(canvas, barcode) {
  if (!canvas) return;
  if (EXTRACT_URL.indexOf('http') !== 0) { $('extract').innerHTML = '<div class="warn">Label reader not set up yet.</div>'; return; }
  const code = accessCode(false);
  if (!code) { $('extract').innerHTML = '<div class="warn">No access code, so the label was not read.</div>'; return; }
  $('extract').innerHTML = '<div>Reading label...</div>';
  const started = Date.now();
  let data;
  try {
    // Sent as plain text so the browser does not need Apps Script to answer a pre-check first.
    const res = await fetch(EXTRACT_URL, { method: 'POST', body: JSON.stringify({ code: code, image: smallJpeg(canvas) }) });
    data = await res.json();
  } catch (e) {
    $('extract').innerHTML = '<div class="warn">Could not reach the label reader (no signal?). ' + esc(e.message) + '</div>';
    return;
  }
  if (data.error) {
    if (/access code/i.test(data.error)) accessCode(true);
    $('extract').innerHTML = '<div class="bad">Label reader: ' + esc(data.error) + '</div>';
    return;
  }
  showExtract(data.fields || {}, barcode, ((Date.now() - started) / 1000).toFixed(1));
}

function sameText(a, b) {
  return String(a).toUpperCase().replace(/[^A-Z0-9]/g, '') === String(b).toUpperCase().replace(/[^A-Z0-9]/g, '');
}
// Reads the "(01) ... (10) ... (13) ..." line printed under a barcode into code/value pairs.
function parsePrintedCodes(text) {
  const out = [];
  if (!text) return out;
  const re = /\((\d{2,4})\)\s*([^()]*)/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    let v = m[2].trim();
    if (/^(00|01|02|11|12|13|15|16|17)$/.test(m[1])) v = v.replace(/\s+/g, '');
    if (v) out.push({ ai: m[1], val: v });
  }
  return out;
}

// "2026-11-05" -> "11/05/2026", so it can be compared with readDate().
function isoToUs(d) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || '');
  return m ? m[2] + '/' + m[3] + '/' + m[1] : null;
}

function showExtract(x, barcode, seconds) {
  const row = (label, val, note) => val ? '<div>' + esc(label) + ': <b>' + esc(val) + '</b>' + (note || '') + '</div>' : '';
  const check = (printed, scanned) => {
    if (!printed || !scanned) return '';
    return sameText(printed, scanned) ? ' <span>(matches barcode)</span>' : ' <span class="bad">(DIFFERENT from barcode: ' + esc(scanned) + ')</span>';
  };
  const gtin = x.gtin ? ('00000000000000' + String(x.gtin).replace(/\D/g, '')).slice(-14) : null;
  let html = '<div><b>Read from photo in ' + seconds + ' s</b> (readability: ' + esc(x.readability || '?') + ')</div>';
  html += row('Product', x.product);
  html += row('Lot' + (x.lot_label ? ' [' + x.lot_label + ']' : ''), x.lot, check(x.lot, barcode && barcode.lot));
  if (!x.lot) html += '<div class="warn">No lot found on the label.</div>';
  html += row('GTIN', gtin, check(gtin, barcode && barcode.gtin && ('00000000000000' + barcode.gtin).slice(-14)));
  html += row('Pack date', x.pack_date) + row('Harvest date', x.harvest_date) + row('Best by', x.best_by_date);
  html += row(x.packer_role || 'Packer', [x.packer_name, x.packer_address].filter(Boolean).join(', '));
  html += row('Distributed by', x.distributor_name);
  html += row('Country of origin', x.country_of_origin);
  (x.other_codes || []).forEach(c => { html += row(c.label || 'Other code', c.value); });

  // Dates in the numbers printed under the barcode, checked against the printed date lines.
  const printedDate = { '13': x.pack_date, '15': x.best_by_date, '17': x.best_by_date };
  parsePrintedCodes(x.barcode_text).forEach(c => {
    if (!(c.ai in printedDate)) return;
    const d = readDate(c.val);
    let note = '';
    if (d.note && /non-standard/.test(d.note)) {
      note += ' <span class="bad">(wrong order: a standard scanner reads ' + esc(c.val) + ' as ' +
        esc(c.val.substr(2, 2) + '/' + c.val.substr(4, 2) + '/20' + c.val.substr(0, 2)) + ')</span>';
    }
    const label = isoToUs(printedDate[c.ai]);
    if (label) note += label === d.text ? ' (matches printed date)' : ' <span class="bad">(printed date says ' + esc(label) + ')</span>';
    html += row((NAMES[c.ai] || 'Date') + ' in barcode (' + c.ai + ')', d.text, note);
  });
  $('extract').innerHTML = html;
}

// ---------- GS1 parsing ----------
const FIXED = { '00': 18, '01': 14, '02': 14, '11': 6, '12': 6, '13': 6, '15': 6, '16': 6, '17': 6, '20': 2 };
const NAMES = { '00': 'SSCC', '01': 'GTIN', '02': 'Content GTIN', '10': 'Lot', '11': 'Production date',
  '13': 'Pack date', '15': 'Best before', '16': 'Sell by', '17': 'Expiration', '21': 'Serial',
  '30': 'Count', '37': 'Count', '241': 'Customer part number' };

function parseGs1(raw) {
  const hadPrefix = /^(\](C1|d2|Q3|e0)|\u001d)/.test(raw);
  const s = raw.replace(/^\](C1|d2|Q3|e0)/, '').replace(/^\u001d+/, '');
  if (!hadPrefix && !/^(00|01|02)\d{14}/.test(s)) return null;
  const out = [];
  let i = 0;
  while (i < s.length) {
    if (s[i] === GS) { i++; continue; }
    const two = s.substr(i, 2), three = s.substr(i, 3);
    let ai, len;
    if (two in FIXED) { ai = two; len = FIXED[two]; }
    else if (/^3[1-6]$/.test(two)) { ai = s.substr(i, 4); len = 6; }          // weights and measures
    else if (/^41[0-7]$/.test(three)) { ai = three; len = 13; }                // location numbers
    else if (/^(10|21|22|30|37|9\d)$/.test(two)) { ai = two; len = -1; }       // variable length
    else if (/^(24[0-3]|25[0-5]|40[0-3]|42[01])$/.test(three)) { ai = three; len = -1; }
    else { out.push({ ai: '?', val: s.slice(i) }); break; }
    i += ai.length;
    let val;
    if (len > 0) {
      val = s.substr(i, len);
      if (val.length < len) return null;
      i += len;
    } else {
      const end = s.indexOf(GS, i);
      val = end === -1 ? s.slice(i) : s.slice(i, end);
      i = end === -1 ? s.length : end + 1;
    }
    out.push({ ai: ai, val: val });
  }
  return out.length ? out : null;
}

// A UPC, EAN or ITF-14 barcode holds only a GTIN: 8, 12, 13 or 14 digits with a valid check digit.
function plainGtin(t) {
  if (!/^(\d{8}|\d{12,14})$/.test(t)) return null;
  const g = ('00000000000000' + t).slice(-14);
  return gtinOk(g) ? g : null;
}

function gtinOk(g) {
  if (!/^\d{14}$/.test(g)) return false;
  let sum = 0;
  for (let i = 0; i < 13; i++) sum += Number(g[i]) * (i % 2 === 0 ? 3 : 1);
  return (10 - sum % 10) % 10 === Number(g[13]);
}

function readDate(v) {
  if (!/^\d{6}$/.test(v)) return { text: v, note: 'not a date' };
  const a = Number(v.substr(0, 2)), b = Number(v.substr(2, 2)), c = Number(v.substr(4, 2));
  const today = new Date();
  const tries = [
    { y: a, m: b, d: c, note: '' },                                   // YYMMDD, the GS1 standard
    { y: c, m: a, d: b, note: 'non-standard order: MMDDYY' },
    { y: c, m: b, d: a, note: 'non-standard order: DDMMYY' }
  ];
  for (const t of tries) {
    const day = t.d === 0 ? 1 : t.d;                                  // GS1 allows day 00
    const dt = new Date(2000 + t.y, t.m - 1, day);
    const real = t.m >= 1 && t.m <= 12 && dt.getMonth() === t.m - 1 && dt.getDate() === day;
    const years = (dt - today) / (365.25 * 24 * 3600 * 1000);
    if (real && years > -2 && years < 3) {
      const mm = ('0' + t.m).slice(-2), dd = ('0' + day).slice(-2);
      return { text: mm + '/' + dd + '/' + (2000 + t.y), note: t.note };
    }
  }
  return { text: v, note: 'could not read as a date' };
}

function weight(ai, val) {
  const places = Number(ai[3]);
  return (Number(val) / Math.pow(10, places)).toFixed(places) + (ai[1] === '1' ? ' kg' : ' lb');
}

function esc(t) {
  return String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function showResult(text, seconds, warning) {
  const fields = parseGs1(text);
  let html = '<div><b>Scanned in ' + seconds + ' s</b></div>';
  if (warning) html += '<div class="warn">' + esc(warning) + '</div>';
  if (fields) {
    fields.forEach(f => {
      let v = f.val, name = NAMES[f.ai] || 'AI ' + f.ai;
      if (/^(11|12|13|15|16|17)$/.test(f.ai)) {
        const d = readDate(f.val);
        v = d.text + (d.note ? ' (' + d.note + ')' : '');
      }
      if (/^3[12]0\d$/.test(f.ai)) { name = 'Net weight'; v = weight(f.ai, f.val); }
      if (f.ai === '01' || f.ai === '02') {
        if (/^0+$/.test(f.val)) v += ' (NOT A REAL GTIN: all zeros)';
        else v += gtinOk(f.val) ? ' (check digit OK)' : ' (CHECK DIGIT FAILED)';
      }
      const label = f.ai === '?' ? 'Not parsed' : name + ' (' + f.ai + ')';
      html += '<div>' + esc(label) + ': <b>' + esc(v) + '</b></div>';
    });
    const pallet = fields.length === 1 && fields[0].ai === '00';
    if (pallet) html += '<div>This is a pallet label.</div>';
    else if (!fields.some(f => f.ai === '10')) html += '<div class="warn">No lot in this barcode.</div>';
  } else if (plainGtin(text)) {
    const g = plainGtin(text);
    html += '<div>GTIN (UPC/EAN/ITF-14): <b>' + esc(g) + '</b></div>';
    html += '<div class="warn">This barcode type holds only a GTIN, never a lot or date.</div>';
  } else {
    html += '<div>Not a GS1 barcode. Value: <b>' + esc(text) + '</b></div>';
  }
  html += '<div class="raw">Raw: ' + esc(text.split(GS).join(' [GS] ')) + '</div>';
  $('result').innerHTML = html;
}

// ---------- buttons ----------
$('btnStart').addEventListener('click', () => { if (track) resume(); else startCamera(); });
$('btnShot').addEventListener('click', () => {
  if (!track) return;
  scanning = false;
  const shot = takePhoto();
  $('result').innerHTML = '<div><b>Photo only</b> (no barcode read)</div>';
  readLabel(shot, null);
});
$('btnLight').addEventListener('click', async () => {
  if (!track) return;
  lightOn = !lightOn;
  try { await track.applyConstraints({ advanced: [{ torch: lightOn }] }); }
  catch (e) { $('info').textContent = 'This phone does not let the browser control the light.'; }
});
</script>
</body>
</html>
